<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Jungle Spotter — a bright daylight jungle spot-the-difference game: 3 scenes, 7 differences each.">
<link rel="icon" href="data:,">
<title>Jungle Spotter — Spot the Difference</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #12351a;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, sans-serif;
  }
  #wrap {
    width: min(100vw, calc(100vh * 1280 / 720));
    aspect-ratio: 1280 / 720;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    cursor: crosshair;
    border-radius: 6px;
    box-shadow: 0 12px 48px rgba(0, 0, 0, 0.55);
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
  <noscript><p style="color:#fff;text-align:center">Jungle Spotter needs JavaScript enabled.</p></noscript>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
