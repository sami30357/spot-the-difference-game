<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Reef Spotter — spot the difference</title>
<meta name="description" content="Reef Spotter: find 7 differences between two near-identical coral reef pictures, across 3 bright scenes, with a timer, hints and a magnifier lens.">
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #06222e;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* The canvas keeps its 1280x720 logical size and scales to fit the window. */
  #game {
    width: min(100vw, calc(100vh * 1280 / 720));
    height: min(100vh, calc(100vw * 720 / 1280));
    display: block;
    touch-action: none;
    cursor: crosshair;
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="game" aria-label="Reef Spotter: find 7 differences between two coral reef pictures. Click a difference, or move with the arrow keys and press Enter. H hints, M magnifies."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
